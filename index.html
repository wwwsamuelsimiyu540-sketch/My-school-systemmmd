<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School SaaS Dashboard</title>
    <!-- Tailwind CSS for styling on mobile -->
    <script src="https://tailwindcss.com"></script>
    <!-- Supabase JS Client library -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

    <!-- Top Navigation Bar -->
    <nav class="bg-blue-600 p-4 text-white flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold font-mono">SchoolSaaS.ke 🇰🇪</h1>
        <span id="school-name" class="text-sm bg-blue-700 px-3 py-1 rounded">Loading School...</span>
    </nav>

    <!-- Main Dashboard Metrics Container -->
    <main class="p-4 max-w-4xl mx-auto space-y-6">
        
        <!-- Summary Cards Grid -->
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-blue-500">
                <p class="text-xs text-gray-500 uppercase font-semibold">Total Students</p>
                <p id="total-students" class="text-2xl font-bold text-gray-800">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-emerald-500">
                <p class="text-xs text-gray-500 uppercase font-semibold">Pending Fees</p>
                <p id="total-fees" class="text-2xl font-bold text-gray-800">KES 0</p>
            </div>
        </div>

        <!-- Student Admission Input Form Component -->
        <section class="bg-white p-4 rounded-xl shadow space-y-3">
            <h2 class="text-md font-bold text-gray-700">Quick Admit Student</h2>
            <div class="space-y-2">
                <input id="stu-name" type="text" placeholder="Student Full Name" class="w-full p-2 border rounded-lg text-sm">
                <select id="stu-grade" class="w-full p-2 border rounded-lg text-sm">
                    <option value="Grade 1">Grade 1 (Primary)</option>
                    <option value="Grade 7">Grade 7 (Junior School)</option>
                    <option value="Grade 10">Grade 10 (Senior School)</option>
                </select>
                <input id="stu-balance" type="number" placeholder="Opening Fee Balance (KES)" class="w-full p-2 border rounded-lg text-sm">
                <button onclick="admitStudent()" class="w-full bg-blue-600 text-white p-2 rounded-lg font-semibold text-sm hover:bg-blue-700">Save to Supabase</button>
            </div>
        </section>

        <!-- Dynamic Live Students Table Module -->
        <section class="bg-white rounded-xl shadow overflow-hidden">
            <div class="p-4 bg-gray-50 border-b">
                <h2 class="text-md font-bold text-gray-700">Active Student Registry</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-100 text-gray-600 uppercase text-xs">
                        <tr>
                            <th class="p-3">Name</th>
                            <th class="p-3">Class Level</th>
                            <th class="p-3 text-right">Fee Balance</th>
                        </tr>
                    </thead>
                    <tbody id="student-rows" class="divide-y text-gray-700">
                        <!-- Rows dynamically generated by JavaScript below -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Supabase Logic Engine Script Configuration -->
    <script>
        // REPLACE THESE WITH REAL SECRETS FROM YOUR SUPABASE PROJECT SETTINGS
        const SUPABASE_URL = "https://your_actual_project_id.supabase.co";
        const SUPABASE_KEY = "your_actual_anon_public_key";
        
        // HARCODED DEFAULT TESTING TENANT ID (Use a valid UUID from your school table row later!)
        const DEMO_SCHOOL_ID = "PASTE_A_SCHOOL_UUID_HERE";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Fetch & Populate Data on Interface Load
        async function loadDashboardData() {
            // Get Student Records
            let { data: students, error } = await supabaseClient
                .from('students')
                .select('*');
            
            if (error) { console.error(error); return; }

            // Compute aggregations dynamically on phone screen
            document.getElementById('total-students').innerText = students.length;
            const totalBalance = students.reduce((acc, curr) => acc + parseFloat(curr.fee_balance || 0), 0);
            document.getElementById('total-fees').innerText = "KES " + totalBalance.toLocaleString();

            // Render Rows inside Table Element
            const tableBody = document.getElementById('student-rows');
            tableBody.innerHTML = students.length === 0 
                ? `<tr><td colspan="3" class="p-4 text-center text-gray-400">No students found. Add one above!</td></tr>`
                : '';

            students.forEach(student => {
                tableBody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="p-3 font-medium text-gray-900">${student.full_name}</td>
                        <td class="p-3"><span class="bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded-full font-medium">${student.grade}</span></td>
                        <td class="p-3 text-right font-mono text-amber-600 font-semibold">KES ${parseFloat(student.fee_balance).toLocaleString()}</td>
                    </tr>
                `;
            });
        }

        // Insert Action Functionality
        async function admitStudent() {
            const name = document.getElementById('stu-name').value;
            const grade = document.getElementById('stu-grade').value;
            const balance = document.getElementById('stu-balance').value || 0;

            if(!name) { alert('Please enter student full name'); return; }

            const { error } = await supabaseClient.from('students').insert([
                { school_id: DEMO_SCHOOL_ID, full_name: name, grade: grade, fee_balance: balance }
            ]);

            if (error) {
                alert('Database Error: ' + error.message);
            } else {
                alert('Student Admitted Successfully!');
                document.getElementById('stu-name').value = '';
                document.getElementById('stu-balance').value = '';
                loadDashboardData(); // Refresh UI instantly
            }
        }

        // Run data download function on boot
        window.onload = loadDashboardData;
    </script>
</body>
</html>
